name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pdf-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/pdf-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/pdf-service/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npm run build

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: opencircuit
          POSTGRES_PASSWORD: opencircuit
          POSTGRES_DB: opencircuit
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U opencircuit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://opencircuit:opencircuit@localhost:5432/opencircuit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy || npx prisma db push
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npm run build

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm install
      - run: npm run build

  docker-compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config
