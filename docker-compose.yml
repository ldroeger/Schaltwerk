version: "3.9"

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: opencircuit-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opencircuit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opencircuit}
      POSTGRES_DB: ${POSTGRES_DB:-opencircuit}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opencircuit}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
    container_name: opencircuit-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-opencircuit}:${POSTGRES_PASSWORD:-opencircuit}@postgres:5432/${POSTGRES_DB:-opencircuit}
      PORT: 4000
      PDF_SERVICE_URL: http://pdf-service:5000
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    ports:
      - "4000:4000"

  pdf-service:
    build:
      context: ./apps/pdf-service
    container_name: opencircuit-pdf
    restart: unless-stopped
    environment:
      PORT: 5000
    ports:
      - "5000:5000"

  web:
    build:
      context: ./apps/web
    container_name: opencircuit-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"

volumes:
  pg_data:
  uploads:
